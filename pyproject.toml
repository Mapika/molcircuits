[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "molcircuits"
version = "1.0.0"
description = "Mechanistic interpretability of molecular graphs, string circuits, and controllable generation in chemical language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "joblib>=1.3",
    "tqdm>=4.65",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "xgboost>=2.0",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "pillow>=10",
    "contourpy>=1.2",
    "fonttools>=4.40",
]

[project.optional-dependencies]
tdc = ["PyTDC>=0.4"]
interop = ["pyarrow>=14.0", "svgpath2mpl>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["molcircuits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
